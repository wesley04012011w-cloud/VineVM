name: LLM tunnel lab

on:
  workflow_dispatch:

jobs:
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Show runner
        run: |
          echo "CPU: $(nproc)"
          free -h
          df -h /
          uname -a

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          OLLAMA_ORIGINS="*" ollama serve > /tmp/ollama.log 2>&1 &

          for i in {1..60}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama online"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/ollama.log
          exit 1

      - name: Install CORS proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx

          sudo tee /etc/nginx/sites-available/ollama-proxy >/dev/null <<'NGINX'
          server {
              listen 11435;
              server_name _;

              location / {
                  if ($request_method = OPTIONS) {
                      add_header Access-Control-Allow-Origin "*" always;
                      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                      add_header Access-Control-Allow-Headers "*" always;
                      add_header Access-Control-Max-Age "86400" always;
                      return 204;
                  }

                  proxy_pass http://127.0.0.1:11434;
                  proxy_http_version 1.1;
                  proxy_set_header Host localhost:11434;
                  proxy_set_header Origin "";
                  proxy_buffering off;

                  add_header Access-Control-Allow-Origin "*" always;
                  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                  add_header Access-Control-Allow-Headers "*" always;
              }
          }
          NGINX

          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/ollama-proxy /etc/nginx/sites-enabled/ollama-proxy
          sudo nginx -t
          sudo systemctl restart nginx

      - name: Install cloudflared
        run: |
          curl -L --fail --silent --show-error             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64             -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Pull model
        run: ollama pull gemma4:e2b

      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --no-autoupdate             --url http://localhost:11435             --http-host-header="localhost:11435"             > /tmp/cloudflared.log 2>&1 &

          for i in {1..60}; do
            URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)

            if [ -n "$URL" ]; then
              echo "OLLAMA_URL=$URL" >> "$GITHUB_ENV"
              echo "======================================"
              echo "OLLAMA PUBLIC URL: $URL"
              echo "======================================"
              break
            fi

            sleep 1
          done

          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

      - name: Wait for DNS and smoke test
        run: |
          echo "Waiting for DNS and testing $OLLAMA_URL/api/tags"

          for i in {1..60}; do
            echo "Attempt $i/60"

            if getent hosts "$(echo "$OLLAMA_URL" | sed 's#https://##')" >/dev/null 2>&1; then
              HTTP_CODE=$(curl -sS -o /tmp/api-tags.json -w "%{http_code}"                 --max-time 10 "$OLLAMA_URL/api/tags" || true)

              echo "HTTP status: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                echo "======================================"
                echo "OLLAMA API ONLINE THROUGH CLOUDFLARE"
                echo "======================================"
                cat /tmp/api-tags.json
                echo
                exit 0
              fi
            fi

            sleep 1
          done

          echo "Tunnel/DNS/API did not become ready within 60 seconds."
          cat /tmp/cloudflared.log
          cat /tmp/ollama.log
          exit 1

      - name: Keep server alive
        run: |
          echo "LLM online at: $OLLAMA_URL"
          echo "Model: gemma4:e2b"
          echo "The URL is temporary and disappears when this job ends."
          echo "Keeping Ollama + Cloudflare Tunnel alive for ~5h50..."
          sleep 330m
